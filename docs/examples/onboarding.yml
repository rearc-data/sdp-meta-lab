# =============================================================================
# dlt-meta Onboarding Configuration
# =============================================================================
# Defines data flow pipelines for the dlt-meta metadata-driven framework.
# Each entry specifies source ingestion, bronze layer, silver layer, and
# CDC (Change Data Capture) settings for a single data flow.
# =============================================================================

# --- Data Flow: host_status_updates_csv_volume ---
- # Flow identification
  data_flow_group: sdp_meta_lab_flow_group
  data_flow_id: host_status_updates_csv_volume

  # Source configuration
  # Uses Autoloader (cloudFiles) for incremental file ingestion
  source_format: cloudFiles
  source_details:
    # Path to raw data files in Unity Catalog Volume
    source_path_dev: /Volumes/sdp_meta_catalog/sdp_meta_schema/sdp_meta/data
    # DDL schema definition for the source data
    source_schema_path: ${workspace.file_path}/conf/schemas/host_status_updates/host_status_updates.ddl

  # ---------------------------------------------------------------------------
  # Bronze Layer
  # ---------------------------------------------------------------------------
  # Raw ingestion with minimal transformation; data lands as-is from source.
  bronze_catalog_dev: <YOUR_BRONZE_CATALOG>
  bronze_database_dev: <YOUR_BRONZE_SCHEMA>
  bronze_table: host_status_updates_csv_bronze

  # Autoloader reader options for CSV ingestion
  bronze_reader_options:
    cloudFiles.format: csv
    header: "true"
    cloudFiles.inferColumnTypes: "true"
    # Captures any data that doesn't match the expected schema
    cloudFiles.rescuedDataColumn: _rescued_data

  # Partition columns (none for this flow)
  bronze_partition_columns: []

  # Data quality expectations applied at the bronze layer
  bronze_data_quality_expectations_json: ${workspace.file_path}/conf/dqe/host_status_updates_bronze_dqe.json

  # ---------------------------------------------------------------------------
  # Silver Layer
  # ---------------------------------------------------------------------------
  # Cleaned, deduplicated, and conformed data with business logic applied.
  silver_catalog_dev: sdp_meta_lab
  silver_database_dev: sdp_meta_egrun
  silver_table: host_status_updates_csv_silver

  # Transformation rules applied during bronze-to-silver processing
  silver_transformation_json_dev: ${workspace.file_path}/conf/host_status_updates_silver_transformations.json

  # Data quality expectations applied at the silver layer
  silver_data_quality_expectations_json_dev: ${workspace.file_path}/conf/dqe/host_status_updates_silver_dqe.json

  # ---------------------------------------------------------------------------
  # CDC (Change Data Capture) - Apply Changes Configuration
  # ---------------------------------------------------------------------------
  # Defines how incremental changes are merged into the silver table.
  silver_cdc_apply_changes:
    # Primary key column(s) used to identify unique records
    keys:
      - system_id
    # Column used to determine the order/recency of changes
    sequence_by: event_time
    # SCD Type 1: overwrites existing records with latest values
    scd_type: "1"
