bundle:
  name: sdp-meta-lab

scripts:
  upload_test_data:
    env:
      UC_CATALOG_NAME: ${var.uc_catalog_name}
      SDP_META_SCHEMA: ${var.sdp_meta_schema}
      CONF_VOLUME: ${var.conf_volume}
    content: |
      set -euo pipefail
      data_dir="dbfs:/Volumes/$UC_CATALOG_NAME/$SDP_META_SCHEMA/$CONF_VOLUME/data"
      databricks fs mkdirs "$data_dir"
      databricks fs cp "data/host_status_updates.csv" "$data_dir/host_status_updates.csv" --overwrite

  upload_sdp_meta_wheel:
    env:
      UC_CATALOG_NAME: ${var.uc_catalog_name}
      SDP_META_SCHEMA: ${var.sdp_meta_schema}
      CONF_VOLUME: ${var.conf_volume}
    content: |
      set -euo pipefail
      wheel_dir="dbfs:/Volumes/$UC_CATALOG_NAME/$SDP_META_SCHEMA/$CONF_VOLUME/wheel"
      databricks fs mkdirs "$wheel_dir"
      databricks fs cp "wheels/databricks_labs_sdp_meta-0.1.0-py3-none-any.whl" "$wheel_dir/databricks_labs_sdp_meta-0.1.0-py3-none-any.whl" --overwrite

include:
  - resources/*.yml
sync:
  exclude:
    - .gitignore

targets:
  dev:
    mode: development
    default: true
    workspace:
       host: https://dbc-b31a694d-1da3.cloud.databricks.com
    variables:
      development_enabled: true
